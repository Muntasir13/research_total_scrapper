defaults:
  - _self_
  - override hydra/job_logging: logger

# Which scraper to run. Leave null to pick from the menu.
scraper: null

# Set true to log the available scrapers and exit without running one.
list_scrapers: false

# Trading day to export: YYYY-MM-DD, today, or yesterday.
date: today

hydra:
  job:
    # Keep the working directory at the project root so ./data resolves.
    chdir: false
  # Every run gets its own directory here: log, config snapshot, and a dated
  # copy of whatever it produced. Nothing is ever overwritten.
  run:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
