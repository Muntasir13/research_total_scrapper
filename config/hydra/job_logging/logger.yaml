version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": pythonjsonlogger.json.JsonFormatter
    fmt: "%(asctime)s %(levelname)s %(name)s %(message)s"
    rename_fields:
      asctime: timestamp
      levelname: level
      name: logger

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    # One directory per run, so there is nothing to rotate.
    class: logging.FileHandler
    level: DEBUG
    formatter: json
    filename: ${hydra:runtime.output_dir}/scraper.log
    encoding: utf-8

root:
  level: INFO
  handlers: [console, file]

loggers:
  dse_scrapers:
    level: DEBUG
    handlers: [console, file]
    propagate: false
