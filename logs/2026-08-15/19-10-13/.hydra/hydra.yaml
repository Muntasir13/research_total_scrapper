hydra:
  run:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    disable_existing_loggers: false
    formatters:
      json:
        (): pythonjsonlogger.json.JsonFormatter
        fmt: '%(asctime)s %(levelname)s %(name)s %(message)s'
        rename_fields:
          asctime: timestamp
          levelname: level
          name: logger
    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: json
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        level: DEBUG
        formatter: json
        filename: ${hydra:runtime.output_dir}/scraper.log
        encoding: utf-8
    root:
      level: INFO
      handlers:
      - console
      - file
    loggers:
      dse_scrapers:
        level: DEBUG
        handlers:
        - console
        - file
        propagate: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - scraper=company-description
    - date=2026-08-12
  job:
    name: cli
    chdir: false
    override_dirname: date=2026-08-12,scraper=company-description
    id: ???
    num: ???
    config_name: default
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: D:\Office\IDLC Securities\Projects\DSE Scrapping - Company Details
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: D:\Office\IDLC Securities\Projects\DSE Scrapping - Company Details\config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: D:\Office\IDLC Securities\Projects\DSE Scrapping - Company Details\logs\2026-08-15\19-10-13
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: logger
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
